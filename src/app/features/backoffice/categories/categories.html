<div class="page-head">
  <div>
    <span class="eyebrow">Catalogue</span>
    <h1>Categories</h1>
  </div>
  <button type="button" class="btn btn-primary btn-sm" (click)="nouveau()">Nouvelle categorie</button>
</div>

<div class="list-detail-grid">
  <div class="tag-card">
    <div class="table-toolbar">
      <app-search-input [(value)]="recherche" placeholder="Rechercher une categorie" />
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (categorie of categoriesFiltrees(); track categorie.id) {
            <tr class="is-selectable" [class.is-selected]="selection()?.id === categorie.id" (click)="selectionner(categorie)">
              <td>{{ categorie.nom }}</td>
              <td>
                <button
                  type="button"
                  class="icon-btn icon-btn-danger"
                  title="Supprimer"
                  aria-label="Supprimer {{ categorie.nom }}"
                  (click)="supprimer(categorie); $event.stopPropagation()"
                >
                  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M4.5 6h11M8.2 6V4.6c0-.6.5-1.1 1.1-1.1h1.4c.6 0 1.1.5 1.1 1.1V6m-6.3 0 .7 9.3c.1.7.6 1.2 1.3 1.2h5.4c.7 0 1.2-.5 1.3-1.2L15.1 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="2" class="table-empty">Aucune categorie ne correspond a la recherche.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>

  <div class="tag-card detail-card">
    <div class="card-head">
      <h2>{{ selection() ? 'Modifier' : 'Nouvelle' }}</h2>
    </div>
    <form class="card-body" (ngSubmit)="enregistrer()">
      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" type="text" [ngModel]="nom()" (ngModelChange)="nom.set($event)" name="nom" />
      </div>

      <div class="detail-actions">
        @if (selection()) {
          <button type="button" class="btn btn-secondary" (click)="nouveau()">Annuler</button>
        }
        <button type="submit" class="btn btn-primary" [disabled]="enregistrement()">
          {{ enregistrement() ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
