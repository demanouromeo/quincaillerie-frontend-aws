@if (uiService.changerMotDePasseOpen()) {
  <div class="modal-overlay" (click)="fermer()">
    <div class="modal-panel tag-card" (click)="$event.stopPropagation()">
      <div class="card-head">
        <h3>Changer mot de passe</h3>
        <button type="button" class="btn btn-ghost btn-sm" (click)="fermer()" aria-label="Fermer">&times;</button>
      </div>
      <form class="card-body" (ngSubmit)="valider()">
        <div class="field">
          <label for="ancien">Ancien mot de passe</label>
          <input id="ancien" type="password" [ngModel]="ancien()" (ngModelChange)="ancien.set($event)" name="ancien" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="nouveau">Nouveau mot de passe</label>
          <input id="nouveau" type="password" [ngModel]="nouveau()" (ngModelChange)="nouveau.set($event)" name="nouveau" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmation">Confirmation</label>
          <input id="confirmation" type="password" [ngModel]="confirmation()" (ngModelChange)="confirmation.set($event)" name="confirmation" autocomplete="new-password" />
        </div>

        @if (errorMessage()) {
          <p class="field-error">{{ errorMessage() }}</p>
        }

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="fermer()">Annuler</button>
          <button type="submit" class="btn btn-primary" [disabled]="submitting()">
            {{ submitting() ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
