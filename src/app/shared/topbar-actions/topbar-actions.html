<div class="session-pill">
  <span class="session-dot"></span>
  <span class="session-login">{{ login() }}</span>
  <span class="session-role">{{ role() }}</span>
</div>
<button
  type="button"
  class="icon-btn"
  (click)="changerMotDePasse()"
  aria-label="Changer le mot de passe"
  title="Changer le mot de passe"
>
  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <rect x="5" y="9" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6" />
    <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="10" cy="12.3" r="1" fill="currentColor" />
  </svg>
</button>
<button
  type="button"
  class="icon-btn logout-btn"
  [class.is-leaving]="loggingOut()"
  [disabled]="loggingOut()"
  (click)="deconnexion()"
  aria-label="Se deconnecter"
  title="Se deconnecter"
>
  <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path
      d="M8.5 3.5H5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3.5"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      class="logout-arrow"
      d="M7.5 10h8m0 0-2.6-2.6M15.5 10l-2.6 2.6"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>
