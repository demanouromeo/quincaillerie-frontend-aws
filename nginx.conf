server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck (docker/EC2 ou sonde manuelle).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Le backend n'est jamais expose directement : seul ce conteneur nginx
    # ecoute sur le port 80 de l'hote (voir templates/deploy-frontend.sh.tftpl),
    # meme origine cote navigateur => pas de CORS a gerer.
    #
    # 127.0.0.11 = DNS interne Docker. On resout "backend" via une variable
    # (plutot qu'en dur dans proxy_pass) pour que nginx demarre meme si le
    # conteneur backend est temporairement absent/en cours de redeploiement,
    # au lieu d'echouer au chargement de la config.
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_upstream "http://backend:8080";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers hashes (main.<hash>.js, styles.<hash>.css, ...) : cache long terme.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Angular gere le routage cote client : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
